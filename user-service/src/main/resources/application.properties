spring.application.name=user-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:userdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Profiles missing locally are auto initialized from the IAM account on first access.
iam.client.enabled=true
iam.client.base-url=http://localhost:8081
iam.client.timeout-ms=3000

user.address.max=5
