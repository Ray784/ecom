server.port=8084
spring.application.name=order-service

spring.datasource.url=jdbc:h2:mem:orderdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

order.kafka.listeners.auto-startup=true
order.kafka.publish-timeout-ms=5000
order.product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8083}
order.product-service.connect-timeout-ms=2000
order.product-service.read-timeout-ms=5000
order.cart.max-items=50
order.cart.ttl-minutes=1440
order.default-shipping-address=Default shipping address on file
