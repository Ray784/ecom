spring.application.name=iam-service
server.port=8081

spring.datasource.url=jdbc:h2:mem:iamdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=ecommerce-platform-demo-hmac-sha256-signing-secret-key
jwt.expiration-ms=3600000

iam.seed.admin.enabled=true
iam.seed.admin.username=admin
iam.seed.admin.password=Admin@1234
iam.seed.admin.email=admin@ecommerce.local

# Set to true to host the shared local Kafka broker for all services on the port below.
embedded.kafka.broker.enabled=false
embedded.kafka.broker.port=9092
embedded.kafka.broker.partitions=1
