server:
  port: 8088

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:h2:mem:reviewdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

review:
  prohibited-words: spam,prohibited,offensive
